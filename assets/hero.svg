<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Yushu Li — Research. Build. Iterate.</title>
<desc id="desc">Learning systems that adapt, reason, and improve. An abstract feedback loop connects learning, evaluation, and improvement.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c1a"/><stop offset="1" stop-color="#243b32"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#6ab695" stop-opacity=".24"/><stop offset="1" stop-color="#6ab695" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#edf4e9" opacity=".09"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90c9ad"/></marker>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<circle cx="960" cy="175" r="220" fill="url(#halo)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
  <rect x="52" y="43" width="8" height="8" rx="2" fill="#bddebe"/>
  <text x="73" y="52" fill="#b6c9bd" font-size="14" letter-spacing="3">RESEARCH / SYSTEMS / OPEN SOURCE</text>
  <text x="49" y="151" fill="#f7f6ec" font-size="82" font-weight="700" letter-spacing="-3">Yushu Li</text>
  <text x="53" y="211" fill="#bde3c9" font-size="31" font-weight="500">Research. Build. Iterate.</text>
  <text x="53" y="260" fill="#b9c8bf" font-size="20">Learning systems that adapt,</text>
  <text x="53" y="290" fill="#b9c8bf" font-size="20">reason, and improve.</text>
  <g fill="none" stroke="#8ebca2">
    <circle cx="969" cy="177" r="105" opacity=".17"/>
    <circle cx="969" cy="177" r="137" opacity=".1"/>
    <path d="M922 107 C971 72 1038 108 1042 154" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1035 199 C1014 252 945 273 908 230" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M888 192 C863 161 868 126 888 111" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" letter-spacing="1.5" font-weight="600" text-anchor="middle">
    <rect x="833" y="77" width="126" height="41" rx="20" fill="#284438" stroke="#426953"/>
    <text x="896" y="103" fill="#d5efdb">LEARN</text>
    <rect x="990" y="160" width="150" height="41" rx="20" fill="#284438" stroke="#426953"/>
    <text x="1065" y="186" fill="#d5efdb">EVALUATE</text>
    <rect x="838" y="212" width="142" height="41" rx="20" fill="#453f2b" stroke="#786946"/>
    <text x="909" y="238" fill="#eddbad">IMPROVE</text>
  </g>
  <circle cx="969" cy="177" r="5" fill="#d5dfbc"/>
  <text x="969" y="322" text-anchor="middle" fill="#829f8f" font-size="11" letter-spacing="3">CURIOSITY → CODE → FEEDBACK</text>
</g></svg>